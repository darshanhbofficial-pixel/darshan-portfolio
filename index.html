    // React-based Typewriter Hook Component
    const Typewriter = ({ words, typingSpeed = 100, deletingSpeed = 60, delay = 2000 }) => {
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [currentText, setCurrentText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        let timer;
        const word = words[currentWordIndex];

        if (isDeleting) {
          timer = setTimeout(() => {
            setCurrentText(word.substring(0, currentText.length - 1));
          }, deletingSpeed);
        } else {
          timer = setTimeout(() => {
            setCurrentText(word.substring(0, currentText.length + 1));
          }, typingSpeed);
        }

        if (!isDeleting && currentText === word) {
          timer = setTimeout(() => setIsDeleting(true), delay);
        } else if (isDeleting && currentText === '') {
          setIsDeleting(false);
          setCurrentWordIndex((prev) => (prev + 1) % words.length);
        }

        return () => clearTimeout(timer);
      }, [currentText, isDeleting, currentWordIndex, words, typingSpeed, deletingSpeed, delay]);

      return (
        <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-500 font-extrabold border-r-4 border-indigo-500 animate-pulse pr-1">

          const scrollPosition = window.scrollY + offset;

          for (const id of SECTION_IDS) {
            const el = document.getElementById(id);
            if (el) {
              const top = el.offsetTop;
              const height = el.offsetHeight;
              if (scrollPosition >= top && scrollPosition < top + height) {
                setActiveSection(id);
                break;
              }
            }

        };

        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);

        document.documentElement.setAttribute('data-theme', theme);

        if (meta) meta.content = theme === 'dark' ? '#030014' : '#eef2ff';

    const ScrollReveal = ({ children, className = '', delay = 0, direction = 'up' }) => {
      const ref = useRef(null);
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { setVisible(true); observer.unobserve(el); }
        }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      const baseClass = direction === 'left' ? 'scroll-reveal-left' : 'scroll-reveal';
      return (
        <div ref={ref} className={`${baseClass} ${visible ? 'is-visible' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
          {children}
        </div>
      );

      const ref = useRef(null);
      const handleMove = (e) => {
        const card = ref.current;
        if (!card || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const rect = card.getBoundingClientRect();
        const rotateX = ((e.clientY - rect.top - rect.height / 2) / rect.height) * -10;
        const rotateY = ((e.clientX - rect.left - rect.width / 2) / rect.width) * 10;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
      };
      const handleLeave = () => { if (ref.current) ref.current.style.transform = ''; };
      return (
        <div ref={ref} className={`tilt-card glass-card ${className}`} onMouseMove={handleMove} onMouseLeave={handleLeave}>
          {children}
        </div>
      );
    };

        const rect = el.getBoundingClientRect();
        el.style.transform = `translate(${(e.clientX - rect.left - rect.width / 2) * 0.18}px, ${(e.clientY - rect.top - rect.height / 2) * 0.18}px)`;

      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        const particleCount = 45;

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.5 + 0.5,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15,
            alpha: Math.random() * 0.4 + 0.1
          });
        }

        const mouse = { x: null, y: null, radius: 120 };
        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const animate = () => {
          ctx.clearRect(0, 0, width, height);
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          ctx.fillStyle = isLight
            ? 'rgba(99, 102, 241, 0.3)'
            : 'rgba(255, 255, 255, 0.4)';

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > width) p.vx = -p.vx;
            if (p.y < 0 || p.y > height) p.vy = -p.vy;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                p.x += (dx / dist) * force * 0.6;
                p.y += (dy / dist) * force * 0.6;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.globalAlpha = p.alpha;
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
